# Android 应用性能采集开关配置
# 工具版本：v2.0.9
#
# 配置值说明：1 / true / yes / on = 开启；0 / false / no / off = 关闭。
# 每个采样点会把关闭项目对应的 CSV 字段留空；报告中会显示该项目未采集。
# 修改并保存本文件后，在 Windows CMD 中使用 --config 指定本文件。
#
# 当前默认只检测 CPU 和内存；其他项目均关闭。
# 如需扩展范围，把对应项目改为 1。
# 也可以直接使用完整采集 EXE 的“采集项目”面板勾选，GUI 会把选择保存回本文件。

# CSV 表头显示模式：zh-en=中文（英文），en=仅英文。
# 默认使用中文（英文），便于直接用 Excel 阅读，同时保留英文字段名供脚本处理。
CSV_HEADER_MODE=zh-en

# CSV 显示开关：1=显示对应项目列，0=不显示对应项目列。
# 大类开关为父开关；父开关=0 时，该大类下所有细项都不输出。
# 默认 CSV 显示 CPU、RSS/PSS 内存和采集状态；其他大类默认不显示。

# 进程信息大类及细项。
DISPLAY_PROCESS=0
DISPLAY_PROCESS_COUNT=1
DISPLAY_PROCESS_PIDS=1
DISPLAY_PROCESS_MAIN_PID=1
DISPLAY_PROCESS_THREAD_COUNT=1

# CPU 大类及细项。
DISPLAY_CPU=1
DISPLAY_CPU_PCT_ALL_CORES=1
DISPLAY_CPU_PCT_ONE_CORE=1
DISPLAY_MAIN_THREAD_CPU_PCT=1

# 内存大类及细项；当前默认隐藏 Java/Native/Code/Graphics/Stack 明细。
DISPLAY_MEMORY=1
DISPLAY_MEMORY_RSS=1
DISPLAY_MEMORY_PSS=1
DISPLAY_MEMORY_JAVA_HEAP=0
DISPLAY_MEMORY_NATIVE_HEAP=0
DISPLAY_MEMORY_CODE=0
DISPLAY_MEMORY_GRAPHICS=0
DISPLAY_MEMORY_STACK=0

# 磁盘 I/O 大类及细项。
DISPLAY_DISK_IO=0
DISPLAY_DISK_READ_BPS=1
DISPLAY_DISK_WRITE_BPS=1
DISPLAY_IO_READ_BYTES=1
DISPLAY_IO_WRITE_BYTES=1

# 网络大类及细项。
DISPLAY_NETWORK=0
DISPLAY_NETWORK_UID=1
DISPLAY_NETWORK_RX_BPS=1
DISPLAY_NETWORK_TX_BPS=1
DISPLAY_NETWORK_RX_BYTES=1
DISPLAY_NETWORK_TX_BYTES=1
DISPLAY_NETWORK_TYPE=1

# 电量大类及细项。
DISPLAY_BATTERY=0
DISPLAY_BATTERY_LEVEL_PCT=1
DISPLAY_BATTERY_STATUS=1
DISPLAY_BATTERY_TEMPERATURE_C=1
DISPLAY_BATTERY_VOLTAGE_MV=1
DISPLAY_BATTERY_CURRENT_UA=1
DISPLAY_APP_POWER_MAH=1

# 温度/热限制大类及细项。
DISPLAY_THERMAL=0
DISPLAY_MAX_THERMAL_TEMP_C=1
DISPLAY_THERMAL_STATUS=1

# 图形/UI 大类及细项。
DISPLAY_UI=0
DISPLAY_FRAMES_TOTAL=1
DISPLAY_JANKY_FRAMES=1
DISPLAY_JANK_PCT=1

# 应用存储大类及细项。
DISPLAY_STORAGE=0
DISPLAY_APP_DATA_KB=1
DISPLAY_APK_KB=1
DISPLAY_APP_STORAGE_KB=1

# 启动/前后台大类及细项。
DISPLAY_STARTUP=0
DISPLAY_FOREGROUND=1
DISPLAY_FOREGROUND_TRANSITION=1
DISPLAY_FIRST_PROCESS_SEEN_S=1
DISPLAY_FIRST_FOREGROUND_SEEN_S=1
DISPLAY_STARTUP_OBSERVED_S=1
DISPLAY_STARTUP_STATUS=1

# 稳定性大类及细项。
DISPLAY_STABILITY=0
DISPLAY_CRASH_COUNT=1
DISPLAY_ANR_COUNT=1
DISPLAY_LOGCAT_ERROR_COUNT=1

# 系统资源大类及细项。
DISPLAY_SYSTEM=0
DISPLAY_SYSTEM_CPU_PCT=1
DISPLAY_SYSTEM_LOAD_1M=1
DISPLAY_SYSTEM_MEM_TOTAL_MB=1
DISPLAY_SYSTEM_MEM_AVAILABLE_MB=1
DISPLAY_SYSTEM_STORAGE_FREE_KB=1

# 设备信息大类及细项。
DISPLAY_DEVICE=0
DISPLAY_DEVICE_SERIAL=1
DISPLAY_DEVICE_MANUFACTURER=1
DISPLAY_DEVICE_BRAND=1
DISPLAY_DEVICE_MODEL=1
DISPLAY_ANDROID_VERSION=1
DISPLAY_ANDROID_SDK=1
DISPLAY_BUILD_ID=1

# 公共状态列：ADB 状态默认隐藏，采集状态默认显示。
DISPLAY_ADB_STATE=0
DISPLAY_STATUS=1

# 基础进程信息：进程数、PID、主进程 PID、线程数、前后台状态。CPU/内存检测内部仍会读取进程信息。
COLLECT_PROCESS=0

# CPU：全核占用、单核标准占用、主线程 CPU。
COLLECT_CPU=1

# 内存：RSS、PSS、Java Heap、Native Heap、Code、Graphics、Stack。
COLLECT_MEMORY=1

# 磁盘 I/O：读写速率、累计读写字节数。
COLLECT_DISK_IO=0

# 网络：应用 UID、收发速率、累计流量、网络类型。
COLLECT_NETWORK=0

# 电量：电池百分比、充电状态、电压、电流、应用估算耗电量。
COLLECT_BATTERY=0

# 温度：电池温度、最高热区温度、系统热限制状态。
COLLECT_THERMAL=0

# 图形/UI：总渲染帧、卡顿帧、卡顿比例。
COLLECT_UI=0

# 存储：应用数据目录、APK、应用总占用。
COLLECT_STORAGE=0

# 启动与前后台：首次发现进程、首次进入前台、前后台切换、启动观测。
# 只有 --launch cold 或 --launch hot 时，启动观测才会主动执行启动动作。
COLLECT_STARTUP=0

# 稳定性：崩溃、ANR、Logcat 错误计数。这里只保存计数，不导出完整日志。
COLLECT_STABILITY=0

# 系统资源：整机 CPU、1 分钟负载、总/可用内存、可用存储。
COLLECT_SYSTEM=0

# 设备信息：序列号、厂商、品牌、型号、Android 版本、SDK、Build ID。
COLLECT_DEVICE=0
